# CAN THE LIVE SITE WRITE LETTERS?
#
# Letterly's pages load even when no agent can run: a missing, rejected, or exhausted OpenRouter key leaves the home
# page answering 200 while every letter fails. So this asks /api/health, which answers 200 {"ok":true} only when the
# deployment's OpenRouter key is valid and has credit, and 503 {"ok":false} otherwise. A failed run emails the
# repository owner.
#
# Two limits of running this on GitHub Actions:
#   - GitHub delays scheduled workflows under load, so treat 15 minutes as a ceiling on detection, not a guarantee.
#   - Scheduled workflows are disabled after 60 days without repository activity. On a quiet repo this stops silently.
# An external uptime service has neither limit.

name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  health:
    name: live site can use its OpenRouter key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          # The hostname students use. Checking a different one could report green while this one is down.
          URL: https://letterly.aroughidea.com/api/health
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/body 2>/dev/null; then
              echo "ok: attempt $attempt returned 200 {\"ok\":true}"
              exit 0
            fi
            echo "attempt $attempt: status $code"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo
          echo "THE LIVE SITE CANNOT USE ITS OPENROUTER KEY."
          echo "  last status: $code"
          echo
          echo "503 means the key is missing, rejected, or out of credit: pages load, letters fail."
          echo "Check the OpenRouter dashboard (key status and spending limit) and the OPENROUTER_API_KEY"
          echo "environment variable in Vercel. A 000 means the request never completed: check the domain"
          echo "and the latest deployment first."
          exit 1
